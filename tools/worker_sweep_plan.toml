# WORKER-SWEEP PLAN — the pre-registered ladder and every threshold the sweep decides with.
# Consumed by `python -m mantis.diagnostics.worker_sweep --plan tools/worker_sweep_plan.toml`.
#
# A FILE, not source defaults: committed BEFORE the sitting, so `git log` proves the rule
# predates the numbers. Lives under tools/ and not configs/ because CI gate 7 schema-validates
# every configs/ file against RunConfig and would red on this one; the precedent for the home is
# tools/bench_floors.toml, a tracked TOML of pre-registered thresholds read by one consumer.
#
# Every key is required and an unknown key is refused: there is no default anywhere in
# `mantis.diagnostics.worker_sweep`, and a missing key raises ValueError naming it.
#
# The LADDER (2, 4, 8, 12, 14) and the KNEE PERCENT (95) are PINNED IN SOURCE —
# `mantis.diagnostics.worker_sweep.RULED_RUNGS` / `RULED_KNEE_PCT`. They are stated here so the
# report echoes what it ran under, and the loader REFUSES any other value for either one.
#
# Legitimately editable: the MEASUREMENT BUDGET (round lengths, round counts, sampler interval)
# and this design's own OPERATIONALIZATIONS of the ruling's words — `band_pct` and
# `plateau_rounds` make "memory discipline holds" checkable, `min_gain_pct` and `extension_step`
# make "while gains persist" checkable, `extension_max` is a runaway stop. None of it is movable
# IN the sitting: an in-sitting edit to this file is a pre-registration change and HALTs.

[provenance]
prereg_ruling   = "R309(f)"
prereg_recorded = "2026-08-22"
authored_by     = "WORKER-SWEEP PREP (Phase W of the re-sit, R309(g))"
note = """The operator's row: n_workers = 1 REJECTED; bracket (1..14]; extension past 14 \
permitted while throughput gains persist and memory discipline holds, bounded above by the \
box's measured thread count; point value by the knee rule — the smallest rung within 95% of \
the best PASSING rung's throughput; a rung PASSES only on a PLATEAU memory verdict; GROWING \
fails the rung; REFUSED is never a verdict; an OOM fails the rung and stops ladder extension."""

[ladder]
# 1 is ABSENT because it is REJECTED, and the loader refuses a plan that puts it back — the
# rule cannot be un-made by editing the file it is written in.
rungs = [2, 4, 8, 12, 14]
# Extension rungs are `best_passing + extension_step`, walked while gains persist.
extension_step = 2
# A hard ceiling independent of the box. The real bound is the measured thread count; this
# exists so a host that reports an implausible affinity mask cannot walk the ladder for hours.
# Whichever bound is lower governs, and the report names which one stopped it.
extension_max = 32
# "While throughput gains persist" made checkable: an extension rung continues the walk only
# if it PASSES and beats the best passing rung so far by more than this. 5% is the same width
# as the plateau band below, deliberately — a gain smaller than the memory band's own
# tolerance is not a gain this instrument can distinguish from noise.
min_gain_pct = 5.0

[rounds]
# A measurement ROUND is a fixed wall window; rounds exist because the stopping rule needs a
# SERIES, since one number cannot plateau.
#
# The first TWO rounds of a rung are DISCARDED: pool start-up is not throughput, and `classify`
# compares its trailing window against the running maximum BEFORE the window, so a start-up
# transient inside a MEASURED round would raise the baseline and let a strictly rising window
# underneath it still verdict PLATEAU. The driver still REPORTS a strictly rising trailing
# window as a disclosed non-gating flag.
#
# `measured_rounds` must be GREATER than `plateau_rounds`, not merely not-fewer: at equality
# `classify` takes its degenerate branch (baseline = the first element, window = the whole
# series) and the rule silently becomes something else. The loader refuses equality.
#
# COST, so nobody discovers it at the box: 7 rounds x 120 s = 14 minutes per rung, 5 base rungs
# = ~70 minutes before any extension rung.
warmup_rounds = 2
measured_rounds = 5
round_sec = 120.0
# Sampled every 1 s rather than 5 s, since a coarser poll can miss a sub-poll allocation spike;
# the report prints the sample count beside every peak so the remaining limit is on the face of
# the figure, not in a footnote.
sampler_interval_sec = 1.0

[stopping_rule]
# Applied by `mantis.diagnostics.eval_child_memory.classify`, imported rather than re-written,
# so there is one stopping rule and one place it can be wrong. TRAILING window of 3 of 5 rounds:
# a window equal to the series would make GROWING unreachable, and a window of 1 would call any
# single quiet round a plateau.
plateau_rounds = 3
# 1.0, re-derived for the quantity it is now applied to (`max(card level, allocator peak)`,
# which on the 2026-08-22 host is the CARD LEVEL in nearly every round — a ~15.48 GiB number
# with a large constant floor) rather than inherited: 5% of that would be 774 MiB of permitted
# growth per round, against a sitting whose falsifier fired on a 343 MiB overshoot with 19.6 MiB
# of card left; 1% is ~158 MiB per round, ~478 MiB across the three-round window.
#
# STATED LIMITATION: a percentage of a level is the wrong SHAPE — the same percentage means
# different absolute growth on a different card, and the constant floor makes it a looser test
# than the same number on a demand peak. An absolute band would be the right instrument;
# `classify` takes a percentage and there is ONE stopping rule in this tree.
band_pct = 1.0

[selection]
# The smallest rung within 95 percent of the best PASSING rung's throughput.
knee_pct = 95.0
# WHICH throughput ranks the rungs. Closed token set {"moves_per_min", "games_per_min"}; BOTH
# figures are recorded and printed either way, only the RANKING is single-valued. Pre-registered
# as moves_per_min: on a CPU host at 2 workers a 20 s window produced 22 moves and ZERO completed
# games, since a game runs to max_game_moves — games_per_min reads 0 for a healthy rung whenever
# a round is shorter than a game, and a metric that can be 0 for a healthy rung cannot rank
# rungs. A "move" here is the engine's positions_generated, ONE PER APPLIED COMPOUND TURN (two
# stones), not a ply — verified at crates/mantis-selfplay/src/runner/search_drive.rs:1002.
metric = "moves_per_min"
