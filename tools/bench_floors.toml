# Production bench floors — WPBOX CB-1/CB-3 (R29; this file IS the R18 implementation).
# Point estimates are criterion mid estimates (seconds) measured SERIALIZED on the
# quiet production box; low/high bracket the 95% CI. CONSUMER: LAW-09's bench
# discipline (one change = one commit = one IQR-gated bench vs these floors) plus
# tests/tools/test_bench_floors.py (schema/provenance/liveness validation).
# Provenance carries interpreter/numpy/rustc/CPU-model ONLY (R112 — no host identifiers).

[provenance]
interpreter = "Python 3.11.15 (main, Jun  2 2026, 22:26:03) [Clang 22.1.3 ]"
numpy = "2.4.6"
rustc = "rustc 1.97.1 (8bab26f4f 2026-07-14)"
