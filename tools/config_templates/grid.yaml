# TEMPLATE — not a runtime input; configs are minted from it via tools/mint_config.py
# (repo_design §5). Grid-identity (v6_live2_ls) lineage — the real 19x19 CNN production
# encoding; keeps grid-lineage mint deltas small.
schema_version: 1
run_id: template_grid
seed: 20260716
identity:
  encoding: v6_live2_ls
  representation: grid
eval:
  random_model_sims: 96
  sealbot_model_sims: 128
  kraken_model_sims: 128
  strix_model_sims: 128
  # adjudication A-2: dev/smoke templates mint a small non-zero floor so the headless
  # end-to-end round exercises a real bot; the run3-parity config overrides this to 0.
  random_floor_games: 4
  worker_device: cuda
  round_timeout_sec: 3600.0
  worker_kill_grace_sec: 10.0
  gate:
    stride: 1
    screen_games: 80
    confirm_games: 128
    promotion_winrate: 0.55
    screen_confirm_lo: 0.44
    deploy_sims: 150
    opening_book: book_v1_s20260625_p4
    bootstrap_resamples: 1000
    min_distinct_per_pair: 10
    seed_base: 20260625
  ladder:
    rungs:
      - name: sealbot_d5
        bot: sealbot
        variant: d5
        depth: 5
        opponent_sims: null
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
      - name: kraken_raw
        bot: kraken
        variant: raw
        depth: null
        opponent_sims: null
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
      - name: sealbot_d6
        bot: sealbot
        variant: d6
        depth: 6
        opponent_sims: null
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
      - name: kraken_mcts200
        bot: kraken
        variant: mcts200
        depth: null
        opponent_sims: 200
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
      - name: strix_128
        bot: strix
        variant: s128
        depth: null
        opponent_sims: 128
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
      - name: strix_256
        bot: strix
        variant: s256
        depth: null
        opponent_sims: 256
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
    round_games: 64
    min_games_per_active_rung: 4
    graduation_wr_lower_ci: 0.75
    graduation_consec_rounds: 3
    activation_wr_lower_ci: 0.65
    calibration_every_k_rounds: 4
    calibration_games: 8
    bootstrap_resamples: 1000
    bootstrap_ci_level: 0.95
    bt_prior_games: 1.0
    bootstrap_seed: 1234
train:
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  fp16: true
  amp_dtype: fp16
  lr_schedule: cosine
  total_steps: 1000000
  scheduler_t_max: null
  eta_min: 0.0005
  min_lr: null
  checkpoint_interval: 0
  actor_sync_cadence_steps: 1
  max_train_steps: 1000000
  # WPAX Phase D (R65/R80/R79+R83): the draw-rate collapse hard abort's terms.
  # `null` is the EXPLICIT off posture and is what the TEMPLATE ships, matching the
  # conservative `monitor.actor_lag_abort_enabled: false` precedent — a production
  # config ARMS it with one whole-block mint delta, e.g.
  #   --set 'train.draw_rate_abort={threshold: 0.25, min_step: 25000, min_samples: 50}'
  # The three travel together (R80) and are RUN-SCOPED CONSTANTS fixed at mint prereg
  # (R82/R85) — never hand-edited in a minted file (R1).
  draw_rate_abort: null
  completed_q_values: false
  value_target: pure_outcome_z
  policy_target: raw_visit_distribution
  draw_reward: -0.5
  ply_cap_value: -0.5
  policy_prune_frac: 0.0
  entropy_reg_weight: 0.0
  aux_opp_reply_weight: 0.0
  uncertainty_weight: 0.0
  ownership_weight: 0.0
  threat_weight: 0.0
  aux_chain_weight: 0.0
  ply_index_weight: 0.0
  threat_pos_weight: 1.0
selfplay:
  n_workers: 1
  leaf_batch_size: 8
  max_game_moves: 128
  inference_pool_size: null
  completed_q_values: false
  c_visit: 50.0
  c_scale: 1.0
  gumbel_mcts: false
  gumbel_m: 16
  gumbel_explore_moves: 10
  results_queue_cap: 10000
  random_opening_plies: 0
  rotation_enabled: true
  forced_win_policy_enabled: false
  forced_win_policy_depth: 2
  forced_win_policy_weight: 1.0
  solver_enabled: false
  solver_depth: 16
  solver_node_budget: 50000
  solver_neighbor_dist: 2
  solver_visit_weight: 0.3
  seed_fraction: 0.0
  seed_corpus_path: null
  log_investigation_metrics: true
  instrumentation_enabled: false
  mcts:
    n_simulations: 50
    c_puct: 1.5
    fpu_reduction: 0.25
    quiescence_enabled: true
    quiescence_blend_2: 0.3
    dirichlet_alpha: 0.3
    dirichlet_epsilon: 0.25
    dirichlet_enabled: true
  playout_cap:
    # fast_sims: STOP-CANDIDATE-FAST-SIMS (DESIGN_P2.md §1.2/§13) — no committed config ever
    # set this key before WPSC Phase 2 (SelfPlayHParams.fast_sims had no dataclass default
    # and was a hard-required kwarg); 50 (matching the sibling n_simulations default) is a
    # NON-AUTHORITATIVE smoke placeholder, not a production value. The real run5 PCR preset
    # is a separate, later decision (DEBT_DOSSIER §7).
    fast_sims: 50
    fast_prob: 0.0
    standard_sims: 0
    full_search_prob: 0.0
    n_sims_quick: 0
    n_sims_full: 0
    zoi_enabled: false
    zoi_lookback: 16
    zoi_margin: 5
    temperature_threshold_compound_moves: 0
    temp_min: 0.5
inference:
  inference_batch_size: 64
  inference_max_wait_ms: 10
  trace_inference: true
  compile_inference: false
  compile_inference_mode: default
  compile_inference_dynamic: true
  perf_timing: false
  perf_sync_cuda: false
monitor:
  alert_entropy_min: 1.0
  collapse_threshold_nats: 1.5
  alert_grad_norm_max: 10.0
  alert_loss_increase_window: 3
  wr_hard_abort_enabled: false
  wr_rolling_consecutive_evals: 2
  wr_rolling_threshold: 0.10
  wr_rolling_min_step: 20000
  wr_collapse_from_peak_ratio: 0.5
  wr_collapse_min_step: 25000
  wr_collapse_consecutive_evals: 3
  wr_early_death_threshold: 0.05
  wr_early_death_min_step: 15000
  axis_warn: 0.45
  axis_alert: 0.50
  heartbeat_deadline_train_step_sec: 1800.0
  heartbeat_deadline_inference_dispatch_sec: 1800.0
  heartbeat_deadline_selfplay_drain_sec: 1800.0
  heartbeat_deadline_eval_round_sec: 1800.0
  heartbeat_poll_interval_sec: 5.0
  heartbeat_file_interval_sec: 15.0
  heartbeat_close_out_deadline_sec: 14400.0
  heartbeat_fire_effect_timeout_sec: 30.0
  actor_lag_threshold_steps: 100
  actor_lag_abort_enabled: false
  supervisor_stale_after_sec: 900.0
  supervisor_poll_interval_sec: 30.0
  supervisor_kill_grace_sec: 30.0
  supervisor_max_relaunches: 5
  drain:
    final_eval_drain_timeout_sec: 900.0
    eval_final_drain_safety_factor: 3.0
    eval_final_drain_hard_cap_sec: 14400.0
    terminal_eval_hard_cap_sec: 14400.0
