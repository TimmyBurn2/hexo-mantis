  # split; the operator's real stride (and the `consec` re-derived in these units) is a mint
  # prereg row, not a value chosen here.
  gate_interval: 1000
  alert_entropy_min: 1.0
  collapse_threshold_nats: 1.5
  alert_grad_norm_max: 10.0
  alert_loss_increase_window: 3
  wr_hard_abort_enabled: false
