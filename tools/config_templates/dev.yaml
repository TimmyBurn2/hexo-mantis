inference:
  inference_batch_size: 64
  inference_max_wait_ms: 10
  trace_inference: true
  compile_inference: false
  compile_inference_mode: default
  compile_inference_dynamic: true
  perf_timing: false
  perf_sync_cuda: false
  # `fused_graph_caps` — the GRAPH inference forward's memory bound (F-816-10, R276(f)).
  # `inference_batch_size` above bounds the number of GRAPHS in one fused pop and bounds
  # neither quantity that drives memory: E and N are SUMS over the fused graphs, and the
  # fuse had no bound at all before this block. Both members are sized TOGETHER from ONE
  # measured fit `peak ~ a + b*E + c*N` against ONE budget, so they are one block and not
  # two keys. `null` is NOT an off state: it is the R119 placeholder, schema-valid and
  # REFUSED at runtime, and the two production configs mint it until the operator measures
  # the value with `python -m mantis.diagnostics.fusion_calibrate` at the box.
  #
  # THE VALUES BELOW ARE DERIVED, NOT CHOSEN — they are NON-BINDING BY CONSTRUCTION, so a
  # smoke or preflight config can BOOT and can never exercise a split by accident (MB-24;
  # the split's coverage must come from the oracles, where its M is asserted). One fused
  # pop holds at most `inference_batch_size` graphs; one graph holds at most
  # `N_ceiling = max_game_moves * (3r(r+1)+1) + max_game_moves + 1` nodes (a hex ball of
  # legal-move radius `r` around each stone, plus the stones and the dummy node) and at
  # most `32 * N` edges (3 axes x 2 signs x 5 depths x 2 directions = 60 directed edges per
  # node, halved by the `(src, dst, axis)` dedup, plus 2 dummy edges per node). Evaluated at
  # this template's own `max_game_moves: 128` and `inference_batch_size: 64`, and at the
  # registry's WIDEST `legal_move_radius` (8, `v6w25`) so a config that overrides the
  # encoding stays covered:  N_ceiling = 128*217 + 129 = 27905
  #   max_fused_nodes = 64 * 27905 + 1        = 1785921
  #   max_fused_edges = 64 * 32 * 27905 + 1   = 57149441
  fused_graph_caps:
    max_fused_edges: 57149441
    max_fused_nodes: 1785921
monitor:
  # R242 (ADJ-D12): the ARMING cadence — the stride, in training steps, at which the live
  # hard-abort gates run and the LAW-18 `monitor_gates` summary emits. Minted EQUAL to this
