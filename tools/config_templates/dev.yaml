# TEMPLATE — not a runtime input; configs are minted from it via tools/mint_config.py
# (repo_design §5). Carries every WP8+WP11-A field so minted configs are complete (CI
# gate 7). gnn_axis_v1 / graph identity lineage.
schema_version: 1
run_id: template_dev
seed: 20260716
eval_enabled: true
# `allocator_posture` — the CUDA caching allocator's REGIME (RECAL-PREP, R308(g)(i)).
# `null` is R119's PLACEHOLDER, not an off state: schema-valid so this template mints
# complete configs, and REFUSED at boot on any cuda process, so a run cannot proceed under a
# regime nobody measured. The VALUE is a measurement the re-calibration sitting takes under
# R282(b) — the 2026-08-22 sitting measured 14.98 GiB of card high-water under DEFAULT
# against 11.36 under `expandable_segments:True` at matched config and duration, and could
# not adopt the better one because nothing minted, checked or armed it. That is what this
# key ends. Mint it with the caps, in the same act, or not at all.
allocator_posture: null
identity:
  encoding: gnn_axis_v1
  representation: graph
eval:
  random_model_sims: 96
  sealbot_model_sims: 128
  kraken_model_sims: 128
  strix_model_sims: 128
  # adjudication A-2: dev/smoke templates mint a small non-zero floor so the headless
  # end-to-end round exercises a real bot; the run3-parity config overrides this to 0.
  random_floor_games: 4
  worker_device: cuda
  round_timeout_sec: 3600.0
  worker_kill_grace_sec: 10.0
  # F-R-P2B-5 early-strength eval posture. Both blocks ship DISARMED (`null`), which is the
  # IDENTITY posture: a ply-capped game stays a draw and the ladder runs ungated, exactly as
  # before the keys existed. `null` is not a placeholder value — it is the explicit statement
  # that the posture is off, the same shape `train.draw_rate_abort` uses (R79), and arming
  # either one is a mint-prereg event with operator-owned values, never an IMPL edit.
  # Armed shapes, for the operator writing the `--set`:
  #   ply_cap_adjudication: {criterion: longest_run_margin, min_margin: <int >=1>}
  #   strength_floor: {probe_games: <int >=1>, min_decisive_rate: <0..1>, min_winrate: <0..1>}
  ply_cap_adjudication: null
  strength_floor: null
  gate:
    stride: 1
    screen_games: 80
    confirm_games: 128
    promotion_winrate: 0.55
    screen_confirm_lo: 0.44
    deploy_sims: 150
    opening_book: book_v1_s20260625_p4
    bootstrap_resamples: 1000
    min_distinct_per_pair: 10
    seed_base: 20260625
  ladder:
    rungs:
      - name: sealbot_d5
        bot: sealbot
        variant: d5
        depth: 5
        opponent_sims: null
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
      - name: kraken_raw
        bot: kraken
        variant: raw
        depth: null
        opponent_sims: null
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
      - name: sealbot_d6
        bot: sealbot
        variant: d6
        depth: 6
        opponent_sims: null
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
      - name: kraken_mcts200
        bot: kraken
        variant: mcts200
        depth: null
        opponent_sims: 200
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
      - name: strix_128
        bot: strix
        variant: s128
        depth: null
        opponent_sims: 128
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
      - name: strix_256
        bot: strix
        variant: s256
        depth: null
        opponent_sims: 256
        opening_book: book_v1_s20260625_p4
        deploy_matched: true
        games_max: 32
    round_games: 64
    min_games_per_active_rung: 4
    graduation_wr_lower_ci: 0.75
    graduation_consec_rounds: 3
    activation_wr_lower_ci: 0.65
    calibration_every_k_rounds: 4
    calibration_games: 8
    bootstrap_resamples: 1000
    bootstrap_ci_level: 0.95
    bt_prior_games: 1.0
    bootstrap_seed: 1234
train:
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  fp16: true
  amp_dtype: fp16
  device: cuda
  lr_schedule: cosine
  total_steps: 1000000
  scheduler_t_max: null
  eta_min: 0.0005
  min_lr: null
  checkpoint_interval: 0
  actor_sync_cadence_steps: 1
  ema:
    enabled: false
    decay: 0.999
    update_every: 10
  max_train_steps: 1000000
  # WPAX Phase D (R65/R80/R79+R83), statistic replaced by R92 (WPMINT Phase DS): the
  # draw-rate collapse hard abort's terms. `null` is the EXPLICIT off posture and is what
  # the TEMPLATE ships, matching the conservative `monitor.actor_lag_abort_enabled: false`
  # precedent — a production config ARMS it with one whole-block mint delta, e.g.
  #   --set 'train.draw_rate_abort={threshold: 0.25, min_step: 25000, N_pool_min: 50, consec: 3}'
  # `consec` (WPMINT Phase K-B, R78/R80) is the FOURTH term: consecutive OBSERVATIONS above
  # the threshold before the abort fires. It was a code-side default `draw_rate_consec = 3`
  # and is authored INSIDE the block because a term of a disarmed abort is not a fact.
  # `N_pool_min` is R92's evidence bar on the POOLED count-weighted rate (it replaced the
  # per-worker `min_samples` inclusion bar); it must be <= DRAW_RATE_WINDOW *
  # selfplay.n_workers, which schema/core.py enforces at load.
  # The four travel together (R80) and are RUN-SCOPED CONSTANTS fixed at mint prereg
  # (R82/R85/R92) — never hand-edited in a minted file (R1).
  draw_rate_abort: null
  # ── the step-coordinator knobs (WPMINT Phase K-B — CARD-COORD-KNOBS, R78/R80) ────────
  # Until this phase these knobs were LITERALS inside `mantis.run._step_coordinator_config`
  # and terminal defaults on `StepCoordinatorConfig`: they decided what a run WAS while no
  # config could see them and no mint record published them. Every value below is the value
  # the code already used, so this template is a change of AUTHOR, not of behaviour — with
  # ONE deliberate exception, `batch_size`, which is minted at the 256 the production path
  # really used rather than the 8 the dead dataclass field said (WPMINT K-A's measurement).
  # Six sibling fields had no reader at all and were DELETED rather than authored (call K-a).
  # Read by ONE path: mantis.config.resolve.coordinator.resolve_coordinator_knobs.
  eval_interval: 1000
  log_interval: 1000
  # `buffer_save_interval` DELETED by R178(a) (R116/LAW-08): the replay-BUFFER save it
  # paced was measured production-dead on every leg (WP12-R Phase CS, F-CS-2), so the key
  # had no reachable effect and does not ship into the run5 mint record. The comment that
  # stood here ("close-out and the shutdown signal still save") was false on both halves.
  min_buf_size: 1
  replay_capacity: 100000
  # `[]` = no ramp. Each stage is `{step: <train step>, capacity: <new capacity>}` and the
  # steps must be STRICTLY INCREASING (the consumer's cursor never rewinds).
  replay_capacity_schedule: []
  training_steps_per_game: 1.0
  max_train_burst: 1
  batch_size: 256
  # `microbatch_caps` — the GRAPH training step's memory bound (WP12-R F2,
  # CARD-RUN5-GPU-OOM, R179). `batch_size` above bounds the number of GRAPHS and bounds
  # neither quantity that drives memory; these two bound both terms of the measured cost
  # model `peak ~ a + b*E + c*N`. The sampled batch is SPLIT at graph boundaries under both
  # members and gradients are ACCUMULATED, so the optimizer result is the un-split step's.
  # THE TEMPLATE VALUES ARE NON-BINDING BY CONSTRUCTION and that is deliberate: the largest
  # batch ever measured in this repository is run5's `batch_size: 256` collate at
  # E = 18 735 930 / N = 699 533, so 100 000 000 / 4 000 000 sit 5.3x and 5.7x above it and
  # cannot split any batch a smoke config produces. A smoke config whose cap BOUND would make
  # CI exercise a split BY ACCIDENT, and the split's coverage has to come from the oracles,
  # where the micro-batch count is asserted rather than incidental. run5 overrides both
  # members with the operator's sized values at mint (R119/R85).
  microbatch_caps:
    max_edges: 100000000
    max_nodes: 4000000
  augment: false
  recency_weight: 0.0
  mixing_initial_w: 0.0
  mixing_min_w: 0.0
  mixing_decay_steps: 1.0
  # The `grad_norm_hard_abort` gate. 1e9 is the shipped value and it is effectively OFF — no
  # finite gradient norm reaches it. That is now VISIBLE rather than silent: WPMINT Phase K-B
  # registered the gate as a DEFERRED armed-abort row (`src/mantis/config/armed_aborts.py`),
  # so gate 12 prints it loudly on every run without gating the mint on a threshold nobody
  # has pre-registered (R84's class). Closing the row means pre-registering a value here.
  hard_gn_threshold: 1000000000.0
  hard_gn_min_steps: 3
  terminal_eval_enabled: true
  # A fraction of each batch drawn from the bot corpus. Its sibling `bot_corpus_path` was one
  # of the six DEAD fields deleted at Phase K-B, so only an injecting caller can supply a bot
  # buffer — 0.0 is the only value the composition root can honour.
  bot_batch_share: 0.0
  # The self-play stall watchdog's budget (LAW-16 says it is ALWAYS armed, so `gt=0`: the
  # schema cannot express the `<= 0` off switch `watchdog.py` still honours for direct
  # constructions).
  selfplay_stall_timeout_sec: 1800.0
  completed_q_values: false
  value_target: pure_outcome_z
  policy_target: raw_visit_distribution
  draw_reward: -0.5
  ply_cap_value: -0.5
  policy_prune_frac: 0.0
  entropy_reg_weight: 0.0
  aux_opp_reply_weight: 0.0
  uncertainty_weight: 0.0
  ownership_weight: 0.0
  threat_weight: 0.0
  aux_chain_weight: 0.0
  ply_index_weight: 0.0
  threat_pos_weight: 1.0
selfplay:
  n_workers: 1
  leaf_batch_size: 8
  max_game_moves: 128
  inference_pool_size: null
  completed_q_values: false
  c_visit: 50.0
  c_scale: 1.0
  gumbel_mcts: false
  gumbel_m: 16
  gumbel_explore_moves: 10
  results_queue_cap: 10000
  random_opening_plies: 0
  rotation_enabled: true
