# vendor/pins.toml — the single vendoring mechanism (repo_design §7). No submodules,
# no loose weights. Each external pin:
#   [pins.<name>]
#   url   = "https://..."        # public git URL
#   sha   = "<40-hex commit>"    # exact commit
#   patch = "vendor/patches/<name>.patch"   # optional, tracked
#   [pins.<name>.assets.<asset>]            # optional release assets
#   url = "https://..."  sha256 = "<64-hex>"  path = "<under vendor/external>"
#   unpack = "<dir under vendor/external>"  # an archive, extracted there
#   from = "<asset>"                        # a member of that unpacked archive (same url)
# `make vendor` (tools/vendor_fetch.sh) clones each pin into vendor/external/<name>
# (gitignored) at its sha and applies the patch; `tools/vendor_fetch.sh <name>` also
# fetches that pin's assets, each verified by sha256 on arrival. Features that need an
# unfetched vendor must skip loudly and name the target that fetches it.
[pins]

[pins.hexo-strix]
# RUNG-2 (R352(e)): the strix rung. The PIN is the repo at the commit below; the RUNG is the
# operator's checkpoint, which the tree does not carry (no weights in it, no releases) and R7
# forbids tracking here — it is placed under vendor/external/strix_models/ and verified against
# `checkpoint_sha256` at every load (mantis.bots.strix). The commit is upstream HEAD on the day
# the checkpoint was supplied (2026-09-13); the operator supplied NO strix commit and NO
# config.toml — the checkpoint embeds `model_config`, `game_config` and `training_config`, and
# `config_sha256` is the sha256 of that embedded triple as sorted compact JSON. The checkpoint
# loads into HeXONet(model_config) at this commit with zero missing or unexpected keys, which is
# the witness that the pin fits the weights. LICENCE: MIT at this sha (local eval only).
url    = "https://github.com/SootyOwl/hexo-strix.git"
sha    = "5a771e572553a8bd8e010112b2ce65f16e5afa1b"
as_of  = "2026-09-13"
checkpoint             = "checkpoint_00237000.pt"
checkpoint_sha256      = "351ed562065bed55528bf4a4bcc7da7bf48f36aec47c60ab108014d6a256447e"
checkpoint_train_steps = 237000
config                 = "embedded in the checkpoint (model_config, game_config, training_config); no config.toml was supplied"
config_sha256          = "8f2f07096db501ed2ed32252c4041298e75d5d575ceaec009f5dbd05c52add02"

[pins.six]
# The Six rung (R374(b); SIX-SCOUT scouted it): CixMango/Six, MIT "including the network". The PIN is
# the repo at the commit below; the RUNG is the v1.2.0 Linux release's `sixengine`, built from engine
# sources identical to this commit's, and a network. `make vendor.six` fetches the release and the
# networks, each verified by sha256 on arrival; `mantis.bots.six` re-verifies the engine, its ONNX
# Runtime (the `runtime*` members: the library the engine loads and the CUDA provider's) and the
# network at every load. Nothing here is tracked (R7). gen 455 is the release's own network and has
# no asset of its own, so its URL is the release's.
url   = "https://github.com/CixMango/Six.git"
sha   = "f2b5ec2d4d7ec42e8b655f739e65821808e03698"
as_of = "2026-09-27"

