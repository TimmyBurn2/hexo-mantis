[workspace]
resolver = "2"
members = [
    "crates/mantis-core",
    "crates/mantis-graph",
    "crates/mantis-encoding",
    "crates/mantis-search",
    "crates/mantis-selfplay",
    "crates/mantis-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# MSRV floor — the oldest compiler this workspace claims to accept, so Cargo emits a clean
# "package requires rustc 1.87" diagnostic instead of a wall of errors inside a dependency.
# Distinct from rust-toolchain.toml's channel, which is what we BUILD with (1.97.1, pinned
# to the bench-floor attestation). Inheritance is opt-in per key: every member manifest
# must carry `rust-version.workspace = true` or this line is inert for that crate.
#
# 1.87 is MEASURED, not chosen, and two independent floors agree on it:
#   (1) first-party source calls `usize::is_multiple_of`, stable since 1.87.0, in
#       mantis-bridge/src/{board.rs, graph_contract.rs} and
#       mantis-selfplay/benches/{graph_build_bench.rs, queue_fuse_bench.rs};
#   (2) the highest `rust-version` declared by any locked dependency is wasip2 1.87.0.
# Lowering this reds `clippy::incompatible_msrv` (in clippy::all, hence CI gate 2b) at every
# such site. Raise it only alongside a re-measurement of both floors.
#
# AUDIT-1 F-52: the list above carried LINE NUMBERS (board.rs:343, graph_contract.rs:90,104)
# and a count ("those four sites"). Every line had shifted and the count was one short — five
# call sites in four files. Files, not lines; the census is `git grep is_multiple_of`.
rust-version = "1.87"

[workspace.dependencies]
pyo3 = { version = "0.28", features = ["abi3-py311"] }
criterion = "0.5"

[workspace.lints.clippy]
pedantic = "warn"

# Portable by default: no target-cpu anywhere in committed config (make build.native
# opt-in via env). panic="unwind" is a hard rule: Rust panics cross the FFI boundary
# as PanicException, never a process abort (repo_design §7).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
