[workspace]
resolver = "2"
members = [
    "crates/mantis-core",
    "crates/mantis-graph",
    "crates/mantis-encoding",
    "crates/mantis-search",
    "crates/mantis-selfplay",
    "crates/mantis-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# MSRV floor — the oldest compiler this workspace claims to accept, so Cargo emits a clean
# "package requires rustc 1.87" diagnostic instead of a wall of errors inside a dependency.
# Distinct from rust-toolchain.toml's channel, which is what we BUILD with (1.97.1, pinned
# to the bench-floor attestation). Inheritance is opt-in per key: every member manifest
# must carry `rust-version.workspace = true` or this line is inert for that crate.
#
# 1.87 is MEASURED, not chosen, and two independent floors agree on it: first-party source
# calls `usize::is_multiple_of`, stable since 1.87.0 (the census is `git grep is_multiple_of`,
# never a transcribed file/line list — one already went stale twice); the highest
# `rust-version` declared by any locked dependency is wasip2 1.87.0. Lowering this reds
# `clippy::incompatible_msrv` (in clippy::all, hence CI gate 2b) at every call site. Raise it
# only alongside a re-measurement of both floors.
rust-version = "1.87"

[workspace.dependencies]
pyo3 = { version = "0.28", features = ["abi3-py311"] }
criterion = "0.5"

[workspace.lints.clippy]
pedantic = "warn"

# Portable by default: no target-cpu anywhere in committed config (make build.native
# opt-in via env). panic="unwind" is a hard rule: Rust panics cross the FFI boundary
# as PanicException, never a process abort (repo_design §7).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
