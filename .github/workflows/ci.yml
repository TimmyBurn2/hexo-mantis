name: ci
on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5          # libpython for `cargo test` linking pyo3
        with: { python-version: "3.11" }
      # rust-toolchain.toml is the SINGLE source of truth for the compiler; do not name a
      # version here too. `dtolnay/rust-toolchain@stable` used to install a floating stable
      # and `rustup default` it — which was already inert (a toolchain file outranks the
      # rustup default for every invocation inside the workspace) while reading as though
      # CI compiled with stable. It also installed `targets:` against the WRONG toolchain.
      # rustup provisions the pinned channel, its components and its targets on first use;
      # this step just makes that happen loudly and early, in its own log line, instead of
      # inside whichever cargo command runs first. Idiom is rustup's own (1.28 release notes).
      - name: "toolchain: materialise the rust-toolchain.toml pin"
        run: rustup show active-toolchain || rustup toolchain install
      - name: "toolchain: report what CI actually compiles with"
        run: rustc --version --verbose && cargo --version
      - name: "gate 2a: cargo test workspace"
        run: cargo test --workspace --locked
      - name: "gate 2b: clippy (pedantic=warn baseline, default lints deny)"
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::all
      - name: "gate 4: wasm check (mantis-graph dep-free)"
        run: make check.wasm
      - name: "gate 5: bench smoke (stub criterion bench)"
        run: make bench

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same single-source rule as the rust job: the compiler comes from
      # rust-toolchain.toml. This job needs cargo only so that `uv sync` can drive maturin
      # to build mantis._engine — and that build already resolved to the pinned channel via
      # the toolchain file, so the previous floating `@stable` install was doing nothing
      # except making the two jobs look like they used different compilers.
      - name: "toolchain: materialise the rust-toolchain.toml pin"
        run: rustup show active-toolchain || rustup toolchain install
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.11" }
      - name: "setup: build the job workspace from the lockfile"
        run: uv sync --locked
      - name: "gate 1: fresh-clone uv sync builds the extension"
        run: bash tools/ci_gates/gate_01_fresh_sync.sh
      - name: "gate 3a: pytest default tier"
        run: uv run pytest -m "not integration and not slow"
      - name: "gate 3b: pytest integration tier"
        run: uv run pytest -m integration
      - name: "gate 3c: collected-test count non-decreasing"
        run: bash tools/ci_gates/test_count_gate.sh
      - name: "gate 7: every configs/ file schema-validates"
        run: uv run python tools/ci_gates/validate_configs.py
      - name: "gate 8: registry sha handshake + audit (auto-arming; WP3 debt)"
        run: bash tools/ci_gates/registry_gate.sh
      - name: "gate 9: import-DAG check"
        run: uv run python tools/check_import_dag.py src/mantis
      - name: "gate 11: no silent encoding-fallback arms"
        run: uv run python tools/ci_gates/silent_encoding_gate.py
      # Mode AUDIT only: no boot, no burst, no GPU — it reads the committed production
      # configs through the real loader and audits the armed-abort manifest. The mode that
      # needs a burst (the full mint preflight) is invoked by NO CI step and is the manual
      # mint gate. rc 0 here covers assertion (c) alone, and the tool says so on stdout.
      - name: "gate 12: armed-abort manifest audit (production configs)"
        run: uv run python tools/ci_gates/preflight_mint.py --audit-only
      # Contract #5's doc drifted through four schema versions with every gate green,
      # because nothing in the repo read it. Every check below is answered by importing
      # RunConfig and the module tree — a transcribed key list would have rotted the same
      # way the doc did.
      - name: "gate 13: contract-doc drift (run config schema)"
        run: uv run python tools/ci_gates/contract_doc_gate.py
      # Gate 14 (WPCLEAN Phase LG, executing CARD-LINT-GATE / R98): the advisory `|| true`
      # posture this step replaces was demoted at R57 with 612 ruff / 1238 pyright findings
      # standing; the WPCLEAN census re-measured 692 / 1301 (CENSUS_LT — the historicals did
      # not reproduce), Phase LT burned the configured surface to ZERO with the remainder
      # dispositioned in config comments, and R98's law then permits a gate: no gate over a
      # dirty baseline, every rule tied to a named in-repo defect class (see the script
      # header), trigger self-tested on every run.
      - name: "gate 14: curated lint/type gate (R98)"
        run: bash tools/ci_gates/lint_gate.sh --self-test

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "gate 6: artifact rejection"
        run: python3 tools/ci_gates/artifact_gate.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: "gate 10: no Makefile/doc reference to untracked paths"
        run: python3 tools/ci_gates/check_tracked_refs.py
