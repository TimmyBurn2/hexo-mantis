[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mantis-engine"
version = "0.1.0"
description = "Compiled engine extension for the mantis package (installs mantis._engine)"
requires-python = ">=3.11"
# The compiled extension marshals every array through rust-numpy, which requires the
# NumPy Python package (its C-API capsule) at runtime — to_tensor / sample_batch /
# GraphWire getters / verify_edge_geometry all fail without it. Hard runtime dep of
# the wheel (matches the crate-local numpy 0.28 Rust dep in Cargo.toml).
dependencies = ["numpy>=1.24"]

[tool.maturin]
module-name = "mantis._engine"
python-source = "python"
features = ["extension-module"]

[tool.uv]
# uv rebuilds this member when Rust sources change, not only on pyproject edits.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "../../Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../mantis-core/src/**/*.rs" },
    { file = "../mantis-graph/src/**/*.rs" },
    { file = "../mantis-encoding/src/**/*.rs" },
    { file = "../mantis-search/src/**/*.rs" },
    { file = "../mantis-selfplay/src/**/*.rs" },
]
