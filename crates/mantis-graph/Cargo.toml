[package]
name = "mantis-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Dep-free by contract: the [dependencies] table is EMPTY and must stay empty —
# the wasm gate (make check.wasm) checks this crate alone. Dev-dependencies are
# bench/test-only and are never linked into the lib or seen by consumers.
[dependencies]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "build_bench"
harness = false

[lints]
workspace = true
