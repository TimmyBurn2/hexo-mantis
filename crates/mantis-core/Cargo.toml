[package]
name = "mantis-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Test-only public stone-planting builder (`Board::from_stones`). Empty feature
# with no code effect when OFF (the default) — the gated impl + its unit test are
# simply not compiled. Enabled via `[dev-dependencies]` in downstream crates
# (e.g. mantis-search) that need non-legal-cadence board fixtures for their tests.
test-fixtures = []

[dependencies]
# External utility crate (no in-workspace deps in mantis-core).
fxhash = "0.2"

[dev-dependencies]
criterion = { workspace = true }
proptest = "1"
# Golden-replay fixture parsing + legal-set digests (test-only).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bench]]
name = "smoke_bench"
harness = false

[[bench]]
name = "board_bench"
harness = false
