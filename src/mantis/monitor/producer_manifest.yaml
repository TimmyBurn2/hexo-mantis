# Seam-7 producer manifest (contract: docs/contracts/event_manifest.md, v1).
#
# ONE row per HEADLESS gate/monitor input. Display panels do NOT exist here — the old
# `monitoring/dashboard_manifest.yaml` panel half died with the dashboards; what survives
# is its law: every consumer binding cites a LIVE producer plus a NAMED producer test
# (R4/LAW-07). `mantis.monitor.manifest.verify_manifest` resolves BOTH halves of every row
# and is itself mutation-self-tested (tests/monitor/test_manifest_contract.py, O-01/O-02).
#
# A row is un-shippable if its producer symbol/event-literal is gone or its producer_test
# node id is stale — which is exactly how F-10 (a gate quietly fed by nothing for 16,880
# steps) is made structurally impossible.
version: 1
channel: jsonl_event_sink            # the ONE channel: the JSONL event sink (structlog is dead)
gates:
  # ── hard-abort gates ──────────────────────────────────────────────────────────────
  - id: draw_rate_collapse
    input: pooled_draw_rate
    producer:
      kind: symbol
      module: mantis.train.coordinator.config
      symbol: pooled_draw_rate
      feeds_from: mantis.selfplay.pool.WorkerPool.pooled_draw_counts
    note: >-
      keyed on the LIVE pooled draw counts, NEVER the NaN draw-target phantom at
      pool_push.py:135 (whose token is grep-banned in this file too — O-15). Armed BY
      THE CONFIG since WPAX Phase D (`train.draw_rate_abort`, R65/R80): run5 arms it at
      threshold 0.25 / min_step 25000 / N_pool_min 50, and `null` is the explicit OFF
      posture the four non-production configs carry. WPMINT Phase DS (R92) replaced the
      statistic: it is the POOLED COUNT-WEIGHTED rate Sum(draws)/Sum(completed) over the
      union of worker windows, and below `N_pool_min` completed games the producer reports
      NO OBSERVATION (None, skip-counted) rather than a fabricated healthy 0.0. The live
      posture is named in every `monitor_gates` event. R242 (ADJ-D12) re-pointed the
      CADENCE: the gate runs from `_run_gate_interval` on `monitor.gate_interval`, not from
      `_run_log_interval` on `train.log_interval` — under the old coupling run5's minted
      log_interval 1000 made this gate unable to take even one observation before training
      step 1000. Every committed config mints gate_interval equal to its own log_interval,
      so the arithmetic in the armed-abort row is unchanged; the re-scaled stride is a mint
      prereg row.
    producer_test: tests/train/test_coordinator_gates.py::test_draw_rate_gate_fires_on_live_producer

  # (stride5_spam gate REMOVED at close-out per operator directive B — stride5-spam is a
  #  dead artifact of bad hyperparams that never occurs under current recipes. The
  #  selfplay-owned WorkerPool.current_stride5_p90() producer stays; only the gate is gone.)

  - id: sealbot_wr_warn
    input: wr_sealbot                # on the ASYNC eval-RESULT dict, never the kick return
    producer:
      kind: symbol
      module: mantis.eval.rounds
      symbol: build_round_result
    also:
      kind: symbol
      module: mantis.train.coordinator.step
      symbol: StepCoordinator.on_eval_round_complete
    note: >-
      ships WARN-ONLY (operator G-3: warn chosen over hard-abort). A sustained-collapse
      trajectory emits a visible `sealbot_wr_warn` and does NOT stop the run; the one-field
      flip `wr_hard_abort_enabled=True` restores the A/B/C hard-abort exactly (capability
      pinned by test_sealbot_hard_abort_capability_when_enabled). The producer landed at
      WP11-A: `build_round_result` unconditionally sets `wr_sealbot` (float|None) on every
      routed round result; `on_eval_round_complete` is the consumer.
    producer_test: tests/eval/test_wr_sealbot_handshake.py::test_round_result_always_carries_wr_sealbot

  - id: grad_norm_hard_abort         # KEPT WP10 gate (decision byte-identical), manifest-cited
    input: grad_norm
    producer:
      kind: symbol
      module: mantis.train.coordinator.step
      symbol: StepCoordinator._run_training_step
    note: >-
      the cited test asserts the gate's DECISION (sustained grad norm above threshold for
      `hard_gn_min_steps` consecutive training steps ⇒ run stops + ONE `hard_abort` event
      naming the rule + a `monitor_gates` entry) — the uniform WP13-A fire contract.
    producer_test: tests/train/test_coordinator_gates.py::test_grad_norm_gate_fires_with_the_uniform_contract

  # ── liveness heartbeats (the L-B watchdog's three sources) ────────────────────────
  - id: heartbeat.train_step
    producer:
      kind: event_literal
      module: mantis.train.coordinator.step
      literal: train_step
    producer_test: tests/train/test_coordinator_gates.py::test_step_loop_beats

  - id: heartbeat.inference_dispatch
    producer:
      kind: event_literal
      module: mantis.selfplay.inference_server
      literal: inference_dispatch
    producer_test: tests/selfplay/test_inference_server.py::test_graph_loop_emits_one_heartbeat_per_batch

  - id: heartbeat.selfplay_drain
    producer:
      kind: event_literal
      module: mantis.selfplay.pool_drain
      literal: selfplay_drain
    producer_test: tests/selfplay/test_pool_drain_parity.py::test_heartbeat_emission_at_drain

  - id: heartbeat.eval_round
    producer:
      kind: event_literal
      module: mantis.eval.pipeline
      literal: eval_round
    also:
      kind: symbol
      module: mantis.monitor.heartbeat
      symbol: HEARTBEAT_SOURCES
    note: >-
      The FOURTH watchdog source (WP11-A) and the one that shipped with no row: the other
      three were registered here and `eval_round` was not, while being armed exactly like
      them — `HEARTBEAT_SOURCES` carries it, `MonitorConfig.heartbeat_deadline_eval_round_sec`
      gives it a 1800 s deadline, `mantis.run` declares it wired iff an eval pipeline was
      built, and a stale beat fires `WATCHDOG_STALL_EXIT_CODE` (42). An ARMED abort input with
      no manifest row is the F-10 shape this file exists to make un-shippable, and the gap was
      invisible because `docs/contracts/event_manifest.md` already TABULATES this row as
      shipped. The producer is the eval pipeline's persistent poller thread
      (`EvalPipeline._poll_loop` -> `_beat("eval_round")`), which beats on EVERY tick with or
      without an in-flight round: a between-round gap must not be able to false-fire the
      watchdog, and round PROGRESS is bounded separately by `round_timeout_sec`. So the source
      answers "is the enforcement thread alive", never "is a round making progress" — a beat
      is NOT evidence of eval progress, and reading it as such would re-invent the silent-hang
      class it closes. The row is `event_literal` on the quoted `"eval_round"` in
      `mantis.eval.pipeline` rather than `symbol` on `_beat`, matching the three sibling
      heartbeat rows: the token the registry keys on is the thing that must not drift, and a
      private method name is not it.
    producer_test: tests/train/test_eval_heartbeat.py::test_poller_thread_beats_eval_round

  # ── run-fatal persistence + the kept lifecycle gates ──────────────────────────────
  - id: persist_fatal
    input: persist_errors_total
    producer:
      kind: symbol
      module: mantis.train.checkpoints
      symbol: persist_errors_total
    also:
      kind: symbol
      module: mantis.monitor.sink
      symbol: JsonlEventSink.persist_errors_total
    producer_test: tests/monitor/test_persist_fatal.py::test_sink_failure_counts_and_aborts

  - id: selfplay_stall               # WP10 games-progress tick watchdog, manifest-cited
    input: games_completed
    producer:
      kind: symbol
      module: mantis.selfplay.pool
      symbol: WorkerPool.games_completed
    producer_test: tests/train/test_lifecycle_contract.py::test_watchdog_fires_after_timeout

  - id: actor_lag                    # WPUF-2 Phase U actor-lag invariant, exit code 45
    input: actor_ckpt_step
    producer:
      kind: symbol
      module: mantis.train.actor_sync
      symbol: ActorSync.actor_ckpt_step
    producer_test: tests/train/test_actor_lag_wiring_live.py::test_actor_ckpt_step_fn_reads_the_live_sync_engine

  - id: resolved_config
    input: resolved_config
    producer:
      kind: symbol
      module: mantis.run
      symbol: compose_run
    note: >-
      WPMAIN §5.4 (LAW-08). `mantis.config.emit.resolve_config` / `to_event_payload` shipped
      with ZERO production call sites — a resolved-config surface with no emitter, i.e. a
      payload nobody had ever published. The composition root now publishes the run's own
      resolved posture into the run's own stream, exactly once per segment, immediately
      after the `run_boot_identity` witness. The payload IS
      `to_event_payload(resolve_config(config))`; a hand-assembled copy would be a second
      authority for the same fact.
    producer_test: tests/test_run_root_lifecycle.py::test_the_composed_boot_publishes_its_resolved_config_once_after_the_identity_witness

  - id: disk_guard
    producer:
      kind: symbol
      module: mantis.train.lifecycle.disk_guard
      symbol: DiskGuard.check_once
    producer_test: tests/train/test_lifecycle_contract.py::test_disk_guard_emits_free_event

  # ── the 4 training-step WARN rules (inputs = training_step payload fields) ─────────
  - id: warn.training_step_alerts
    input: training_step
    producer:
      kind: event_literal
      module: mantis.train.events
      literal: training_step
    note: >-
      rule names: entropy_collapse, selfplay_entropy_collapse, grad_norm_spike,
      loss_increase_window (mantis.monitor.rules.WARN_RULE_NAMES).
    producer_test: tests/train/test_coordinator_gates.py::test_log_interval_emits_training_step

  # ── WP12-R Phase O: the taxonomy rc and the LAW-18 target-integrity fire rates ─────
  - id: target_integrity_counters
    input: WP12-R Phase T LAW-18 target-integrity fire-rates (iteration_complete.target_integrity)
    producer:
      kind: symbol
      module: mantis.train.coordinator.step
      symbol: StepCoordinator._target_integrity_report
    also:
      kind: symbol
      module: mantis.selfplay.pool_hooks
      symbol: runner_stats
    note: >-
      R164: the three Phase-T counters (export_offwindow_mass_moves,
      gridls_zero_policy_rows, target_integrity_defects) were readable ONLY by a test
      calling runner_stats(pool) — PREREG_T §0b names the first as THE in-run witness
      attributing the expected game-shape drift, and a witness a live run cannot read is
      not a witness (LAW-18: a post-hoc offline probe cannot distinguish "starved" from
      "ineffective"). Each now publishes {total, delta, per_position} at every log_interval
      boundary, beside the positions_delta denominator the rate is taken over. LAW-03: the
      unit is fires per RECORDED POSITION — not per game, not per ply — so
      gridls_zero_policy_rows can legitimately exceed 1.0 (one position contributes many
      cluster rows) and it is a rate, never a fraction. per_position is None, never a
      fabricated 0.0, when no position was recorded in the interval; an idle lever stays
      VISIBLE at 0 (target_integrity_defects reads 0 in every run that survives to emit,
      because its latch is run-fatal — that permanent zero is the posture, not an
      unproduced field); a decrease is emitted AS MEASURED, never clamped, because the
      atomics are monotonic and a negative delta is therefore a wiring bug.
      R275(b) adds a FOURTH counter to the same block, inference_failures_total — not a
      Phase-T counter but the SEAM conjunct of the same defect class (F-816-9: a search
      that did not run exported as if it had). It counts leaf inferences that FAILED on an
      OPEN queue; a drain shutdown closes both queues first and does not count. Its
      producer is crates/mantis-selfplay/src/runner/search_drive.rs (the two
      infer_and_expand arms -> FatalDefectLatch::store_inference_failure), pinned by
      crates/mantis-selfplay/tests/search_seam_fatal.rs, and it reaches this block through
      the same two symbols as the other three. It rides HERE rather than in a block of its
      own because the two conjuncts are only useful read together: advanced with
      target_integrity_defects at 0 means the run died at the seam before any target was
      built.
    producer_test: tests/train/test_target_counter_events.py::test_iteration_complete_carries_the_target_integrity_fire_rates

  - id: k_cluster_histogram
    input: iteration_complete.k_cluster_histogram
    producer:
      kind: symbol
      module: mantis.train.events
      symbol: k_cluster_histogram_block
    also:
      kind: symbol
      module: mantis.selfplay.pool_hooks
      symbol: runner_stats
    note: >-
      Item 10(b) / R250 — the LAW-18 fire-rate log for the K-CLUSTER lever, which had none.
      K (how many cluster views a recorded position expands into) is known only inside
      crates/mantis-selfplay/src/runner/record.rs::record_position, and a live run could not
      read it at all: K_avg after the fact cannot separate "K is 1 on every position, the
      multi-window lever is dead" from "K is spread and the lever is working", which is the
      exact starved-vs-ineffective distinction LAW-18 says a post-hoc probe cannot make. The
      Rust producer is a fixed 9-bucket relaxed-atomic array on the runner (buckets 1..=8 by
      K, the last a guard for every K outside that range, derived-bounded against every
      registered k_max by
      mantis_selfplay::runner::record::k_histogram_tests::no_registered_encoding_declares_a_k_max_past_the_real_buckets);
      it crosses the FFI as the SelfPlayRunner.k_cluster_histogram getter and is labelled
      here from the vector's own LENGTH, never a transcribed bucket count.
      ABSENT, not zero, on a GRAPH representation (R250, the ADJ-D32 discipline and the same
      is_graph_run authority the cluster block uses): record_position_graph_dispatch does not
      take the histogram as a parameter, so on that arm the buckets are zero for want of a
      producer. A histogram of zeros is a worse fabrication than a scalar zero because it has
      SHAPE — it reads as a measured distribution. `None` (keyed, never dropped) is the
      distinct case of an engine build with no such getter, per the event_manifest
      unproduced-field convention. LAW-03: the unit is RECORDED POSITIONS, cumulative since
      pool start; the buckets SUM to the dense record_position call count, so the
      distribution is self-normalising and publishes no separate denominator.
    producer_test: tests/train/test_k_cluster_histogram.py::test_a_real_coordinator_publishes_the_k_histogram_on_a_grid_run

  # ── Q3: the inference batching instrument (iteration_complete, LAW-18) ────────────
  - id: batch_fill_pct
    input: iteration_complete.batch_fill_pct
    producer:
      kind: symbol
      module: mantis.selfplay.pool_hooks
      symbol: batch_fill_pct
      feeds_from: mantis.selfplay.inference_server.InferenceServer.total_requests
    also:
      kind: symbol
      module: mantis.selfplay.inference_server
      symbol: InferenceServer.forward_count
    note: >-
      SHIPPED WITH A LIVE PRODUCER AND NO ROW. The mean batch occupancy has been published
      on every `iteration_complete` since WP13-A, fed by the inference server's own
      `_total_requests` / `_forward_count` against `_batch_size`, and nothing made either
      counter's disappearance un-shippable — the F-10 shape (a live-looking field fed by
      nothing) with the producer merely still alive by luck. Registered on the
      `target_integrity_counters` precedent (R164): an in-run LAW-18 instrument on
      `iteration_complete` whose consumer is the operator reading the run, not a gate rule.
      Stated so the difference is not silently re-litigated: `eval_rung_skip_class` was
      deliberately NOT registered on the grounds that a counter with no consuming rule
      would be a producer-without-consumer. The two rulings disagree, and this row follows
      the LATER and closer one; an operator ruling that collapses them is owed.
      LAW-03, because the unit is not obvious: the value is a PERCENTAGE of the configured
      `inference_batch_size`, cumulative since server start, capped at 100 and reported as
      0.0 — not None — before the first forward (the pre-existing spelling, untouched).
    producer_test: tests/selfplay/test_inference_batch_timing.py::test_batch_fill_pct_reaches_the_sink_from_the_live_inference_counters

  - id: inference_batch_timing
    input: iteration_complete.inference_batching
    producer:
      kind: symbol
      module: mantis.selfplay.inference_server
      symbol: InferenceServer.batch_timing_snapshot
    also:
      kind: symbol
      module: mantis.selfplay.pool_hooks
      symbol: inference_batch_timing
    note: >-
      The distribution `batch_fill_pct`'s single ratio cannot resolve, plus the two costs
      it never saw. `queue_wait` is the load-bearing one: it is the wall time spent inside
      `InferenceBatcher.next_graph_batch`, i.e. EXACTLY the Rust collector's
      `batch_size / 2`-or-`max_wait_ms` wait (crates/mantis-selfplay/src/queues/graph.rs),
      so a wait pegged at `inference_max_wait_ms` on every forward is the in-run witness
      that the collector's threshold was never reachable. `collate` is the
      `collate_graph_batch` cost. `occupancy` carries min/max and a power-of-two histogram
      because a mean cannot separate "always 1" from "sometimes 64, sometimes 0".
      Cumulative since server start, with the RAW `count`/`total_ms` published beside the
      derived `mean_ms` so a consumer can difference two consecutive events and recover an
      interval mean.
      PRODUCED ON THE GRAPH PATH ONLY. The dense loop is not instrumented (Q3 scope: no
      hot-path change on a path the finding is not about), so a grid run publishes `None`
      for every derived reading — no producer, never a fabricated 0. `empty_polls` is the
      one counter that stays VISIBLE at 0 on the producing path (the
      `target_integrity_defects` posture) and `None` on the path with no producer.
      NOT BUILT, deliberately: `graph_build_time`. It lives in Rust
      (`mantis-graph::build_axis_graph`, per LEAF), so instrumenting it means a counter
      threaded selfplay -> bridge -> Python, a maturin rebuild and a timing call inside the
      per-leaf hot path — a LAW-09 hot-path change requiring re-run parity oracles and an
      IQR-gated bench, which this bundle's prep-only Phase P (8cb8577) does not have. An
      instrument that perturbs the thing it measures and lands without a bench is not a
      measurement.
    producer_test: tests/selfplay/test_inference_batch_timing.py::test_the_batching_block_reaches_the_sink_on_iteration_complete

  - id: terminal_eval_broken
    input: the terminal round's typed eval_broken reason -> rc 48
    producer:
      kind: symbol
      module: mantis.train.coordinator.drain
      symbol: run_terminal_eval
    also:
      kind: symbol
      module: mantis.eval.errors
      symbol: EvalBrokenReason
    note: >-
      R152/R133. The terminal round's result was computed, emitted, routed and then
      DISCARDED one frame below ShutdownState, so a run whose terminal battery was killed,
      returned garbage or could not persist its ladder state exited 0 (LAW-15: no promotion
      decision = deliverable incomplete). run_terminal_eval now latches the routed result's
      own eval_broken_reason on the coordinator (set-once, ONE writer, reachable only from
      this function), and the composition root re-parses it through EvalBrokenReason before
      recording the terminal_eval_broken rule — resolved to 48 by the ONE resolver,
      armed_aborts.exit_code_for_abort. ONE code for seven reason classes by decision: the
      causes stay pairwise-distinguishable in this channel on the eval_broken event's
      reason.
    producer_test: tests/train/test_terminal_eval_rc.py::test_a_broken_terminal_round_exits_48
