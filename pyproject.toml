[project]
name = "mantis"
version = "0.1.0"
description = "AlphaZero-style self-play bot for Hex Tac Toe (Rust engine + Python training)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "mantis-engine",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.uv.workspace]
members = ["crates/mantis-bridge"]

[tool.uv.sources]
mantis-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mantis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: CI integration tier (runs in CI via `make test.integration`)",
    "slow: on-demand only; excluded from `make test` and CI default tier",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
# BLE = flake8-blind-except: `except Exception:` without re-raise is banned repo-wide
# (repo_design §11 "except Exception: pass is lint-banned").

[tool.pyright]
include = ["src", "tools", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
strict = ["src"]
