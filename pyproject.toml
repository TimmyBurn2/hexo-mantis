[project]
name = "mantis"
version = "0.1.0"
description = "AlphaZero-style self-play bot for Hex Tac Toe (Rust engine + Python training)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "mantis-engine",
    "torch==2.11.0",
]

[project.optional-dependencies]
# R41 (WPSC SC-B7): the three lazily-imported analysis/instrumentation deps and ONLY
# those — corpus_metrics/corpus_reporter/corpus_analysis (matplotlib, rich) and
# selfplay instrumentation's spearmanr (scipy). structlog is deliberately absent:
# nothing imports it (WP10 swapped it for stdlib logging).
analysis = ["matplotlib", "rich", "scipy"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.uv.workspace]
members = ["crates/mantis-bridge"]

[tool.uv.sources]
mantis-engine = { workspace = true }
# torch pulled from the PyTorch CPU wheel index: the WP9 NN-forward parity regime
# is CPU-only, and the +cpu manylinux x86_64 wheel is the MKL/AVX512 build that
# matches the old-side capture backend (torch 2.11.0, BLAS=MKL, ISA=AVX512).
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mantis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: CI integration tier (runs in CI via `make test.integration`)",
    "slow: on-demand only; excluded from `make test` and CI default tier",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# WPCLEAN Phase LT (R98): every selected rule is ZERO at HEAD over src/ + tools/ and gated
# by tools/ci_gates/lint_gate.sh — an advisory rule nobody reads is the fog CARD-LINT-GATE
# was ratified to end. PLE joins the select with a named catch (PLE0303, a live
# TypeError-in-waiting in data/sources/base.py, fixed same-phase).
select = ["E", "F", "W", "I", "UP", "B", "BLE", "PLE"]
# BLE = flake8-blind-except: `except Exception:` without re-raise is banned repo-wide
# (repo_design §11 "except Exception: pass is lint-banned").
# E501 dispositioned NEVER (WPCLEAN CENSUS_LT §7): 266 findings at census, ~all
# comment/doc lines, zero defect history, no auto-fix — a permanently-red advisory rule.
# The 100-column preference stays prose guidance for new code.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tests/ is an oracle-write corpus: files are edit-averse by frozen-oracle discipline, and
# every code below is a zero-defect-value class there (style churn, unused-in-test noise,
# the deliberate re-import idiom). The ADOPTED defect classes — F601, the 3.11-floor parse,
# PLE — stay LIVE over tests: none of them appears in this list (CENSUS_LT / DESIGN_LG_LT).
"tests/**" = ["UP", "I001", "F401", "F811", "F841", "E741", "E402", "BLE001", "B007", "B905", "UP031"]

[tool.pyright]
# WPCLEAN Phase LT config-honesty (R57 measured): `strict = ["src"]` produced 932 of 1301
# errors (71.6%) as strict-mode-only artifacts cascading off torch/numpy partial typing —
# an advisory wall nobody read. Strictness is CARDED as adopt-later (WPCLEAN
# ADJUDICATION_QUEUE: CARD-PYRIGHT-STRICT), not silently dropped. tests/ is excluded with
# grounds: the corpus is frozen-oracle discipline (edit-averse) and its ~312 diagnostics
# were measured test-idiom noise, runtime-guarded by the tests themselves (CENSUS_LT §5b);
# the basic-mode src surface is held at ZERO by tools/ci_gates/lint_gate.sh.
include = ["src", "tools"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
