# Repo-local toolchain pins for what `rust-toolchain.toml` does not cover: node, and the wasm-bindgen CLI.
#
# WHY THIS FILE EXISTS. Gate 14 runs `uv run pyright`, and `pyright` is a shim over node. On a
# host whose node comes from mise, a shim with no selected version resolves to nothing, the
# probe emits no version string, and the gate REFUSES (rc 2, R289(u)) — correctly, because
# nothing was measured. That refusal is a HOST condition, and until now the only fixes were to
# change a developer's GLOBAL mise config or to prepend an installed node bin to PATH by hand
# for every invocation. Both are per-host acts that no clone inherits.
#
# THE SHAPE IS BORROWED, NOT INVENTED: `rust-toolchain.toml` already pins the Rust channel and
# its components, rustup honours it automatically, and no `rustup default` is ever run. This is
# the same contract for node — committed, portable, auto-provisioned on first use by any mise
# host, and it touches no global configuration.
#
# WHAT IT DELIBERATELY DOES NOT DO. It does not disarm the gate's refusal arm. A host without
# mise reads this file as inert and gate 14 still refuses loudly rather than reporting a green
# it did not measure — which is the whole point of R289(u) and is not traded away for
# convenience here. The pin removes the obstacle; it does not remove the detector.
#
# Node type-checks the Python tree (pyright) and builds and tests the shipped browser package
# (`web/`, gate 21). Neither pin carries the perf-attestation weight of the Rust channel: a Rust
# bump invalidates every floor in tools/bench_floors.toml; a node or CLI bump invalidates none.
#
# The wasm-bindgen CLI must equal the `wasm-bindgen` crate in Cargo.lock exactly — the glue it
# writes and the module the crate compiles refuse each other across versions — so it moves only
# with the lock, and `web/scripts/build.sh` refuses any other.
[tools]
node = "26.7.0"
"cargo:wasm-bindgen-cli" = "0.2.126"
